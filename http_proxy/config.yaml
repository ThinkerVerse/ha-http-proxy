---
name: "HTTP Proxy"
version: "3.3.1"
slug: "http_proxy"
description: "HTTP proxy server for local network devices"
url: "https://github.com/ThinkerVerse/ha-http-proxy/tree/main/http_proxy"
arch:
  - aarch64
  - amd64
init: false
startup: services
# Needed so the admin interface can persist option changes through the
# Supervisor instead of writing /data/options.json, which is overwritten.
hassio_api: true
ports:
  8888/tcp: 8888
  8889/tcp: 8889
ports_description:
  8888/tcp: "HTTP proxy port"
  8889/tcp: "Admin interface"
options:
  log_level: "info"
  allowed_networks:
    - "192.168.0.0/16"
    - "172.16.0.0/12"
    - "10.0.0.0/8"
  authentication: false
  username: ""
  password: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  allowed_networks:
    - str
  authentication: bool
  username: str
  password: str
