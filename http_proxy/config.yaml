---
name: "HTTP Proxy"
version: "3.4.0"
slug: "http_proxy"
description: "HTTP proxy server for local network devices"
url: "https://github.com/ThinkerVerse/ha-http-proxy/tree/main/http_proxy"
arch:
  - aarch64
  - amd64
init: false
startup: services
# Needed so the admin interface can persist option changes through the
# Supervisor instead of writing /data/options.json, which is overwritten.
hassio_api: true
# The admin interface is served through Home Assistant, which authenticates the
# user. It listens on the default ingress port, 8099, which is internal and
# deliberately absent from `ports`.
ingress: true
panel_icon: mdi:web
panel_title: "HTTP Proxy"
ports:
  8888/tcp: 8888
  # Direct, unauthenticated access to the admin interface. Left unmapped on
  # purpose; set a port here only if you need it outside Home Assistant.
  8889/tcp: null
ports_description:
  8888/tcp: "HTTP proxy port"
  8889/tcp: "Admin interface (no authentication - prefer the sidebar panel)"
options:
  log_level: "info"
  allowed_networks:
    - "192.168.0.0/16"
    - "172.16.0.0/12"
    - "10.0.0.0/8"
  authentication: false
  username: ""
  password: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  allowed_networks:
    - str
  authentication: bool
  username: str
  password: str
