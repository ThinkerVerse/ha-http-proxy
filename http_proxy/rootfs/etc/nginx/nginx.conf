user nginx;
worker_processes 1;
pid /run/nginx.pid;

# Startup and runtime errors go to the container's stderr so they appear in the
# add-on log rather than a file nobody reads.
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Home Assistant ingress. The Supervisor is the only permitted client; it
    # authenticates the user and strips the ingress path prefix before
    # forwarding, so this sees ordinary paths like / and /api/status.
    #
    # Deliberately no `listen [::]` anywhere: nginx aborts at startup with
    # "Address family not supported by protocol" on a container without IPv6.
    server {
        listen 8099 default_server;
        server_name _;

        allow 172.30.32.2;
        deny all;

        include /etc/nginx/includes/admin.conf;
    }

    # Optional direct access on port 8889. Unmapped by default, because this
    # listener has no authentication of its own - anyone who can reach the port
    # can change the proxy configuration. Prefer the ingress panel.
    server {
        listen 8889;
        server_name _;

        include /etc/nginx/includes/admin.conf;
    }
}
