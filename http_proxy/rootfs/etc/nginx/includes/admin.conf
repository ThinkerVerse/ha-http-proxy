# Shared configuration for the admin interface, used by both the ingress
# listener and the optional direct listener.

root /usr/share/nginx/html;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location /api/ {
    # No trailing slash: the request URI is passed through unchanged, so
    # /api/status reaches the API server as /api/status. A trailing slash here
    # would strip the /api prefix and every route would 404.
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
