---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-addon:
    name: Lint add-on config
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Lint the add-on repository
        uses: frenck/action-addon-linter@v2
        with:
          path: "./http_proxy"

  lint-hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./http_proxy/Dockerfile

  lint-shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -s bash -e SC1008 -e SC2154
        with:
          additional_files: "run"

  lint-api:
    name: API server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./http_proxy/api
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: http_proxy/api/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax check
        run: node --check server.js

  build:
    name: Build ${{ matrix.arch }}
    needs: [lint-addon, lint-hadolint, lint-shell, lint-api]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/http_proxy
